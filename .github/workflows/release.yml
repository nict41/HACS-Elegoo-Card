name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Check the tag matches the card version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE=$(grep -oP 'CARD_VERSION = "\K[^"]+' dist/elegoo-printer-card.js)
          if [ "$TAG" != "$FILE" ]; then
            echo "Tag $TAG does not match CARD_VERSION $FILE in dist/elegoo-printer-card.js"
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/elegoo-printer-card.js
