name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          # The topics check needs GitHub repository topics, which are a
          # repository setting rather than anything in this tree. Ignored so
          # the other seven checks stay meaningful and green; remove this line
          # once topics are set, which is required before submitting to the
          # HACS default store.
          ignore: topics

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm test
